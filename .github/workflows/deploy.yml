name: Deploy PromptLedger

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: Target environment
        required: true
        default: prod
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  PROJECT_NAME: promptledger

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.service == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Python dependencies
        if: matrix.service == 'backend'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Node dependencies
        if: matrix.service == 'frontend'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build and test backend
        if: matrix.service == 'backend'
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
          pytest tests/ -v --cov=app --cov-report=xml

      - name: Build and test frontend
        if: matrix.service == 'frontend'
        working-directory: frontend
        run: |
          npm ci
          npm run lint || true
          npm run build

  deploy-backend:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          missing=0
          if [ -z "${{ secrets.AWS_PRIVATE_KEY }}" ]; then echo "Missing secret: AWS_PRIVATE_KEY"; missing=1; fi
          if [ -z "${{ secrets.BACKEND_INSTANCE_IP }}" ]; then echo "Missing secret: BACKEND_INSTANCE_IP"; missing=1; fi
          if [ -z "${{ secrets.API_URL }}" ]; then echo "Missing secret: API_URL"; missing=1; fi
          if [ $missing -ne 0 ]; then echo "One or more required secrets are missing. Add them in repository settings and retry."; exit 1; fi

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AWS_PRIVATE_KEY }}" > ~/.ssh/promptledger_deploy
          chmod 600 ~/.ssh/promptledger_deploy
          touch ~/.ssh/known_hosts

      - name: Sync backend source
        run: |
          rsync -az --delete \
            -e "ssh -q -i ~/.ssh/promptledger_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR" \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude 'node_modules' \
            --exclude '.next' \
            backend/ \
            ubuntu@${{ secrets.BACKEND_INSTANCE_IP }}:/opt/promptledger/backend/
          rsync -az \
            -e "ssh -q -i ~/.ssh/promptledger_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR" \
            docker-compose.prod.yml \
            ubuntu@${{ secrets.BACKEND_INSTANCE_IP }}:/opt/promptledger/docker-compose.prod.yml

      - name: Start backend database
        run: |
          ssh -q -i ~/.ssh/promptledger_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR ubuntu@${{ secrets.BACKEND_INSTANCE_IP }} '
            set -e
            rm -rf /opt/promptledger/frontend /opt/promptledger/frontend_copy_* /opt/promptledger/backend_copy_*
            cd /opt/promptledger
            sudo docker compose -f docker-compose.prod.yml up -d --force-recreate postgres redis
            sudo docker compose -f docker-compose.prod.yml ps postgres redis
          '

      - name: Wait for backend database
        run: |
          set +e
          for attempt in $(seq 1 60); do
            status=$(ssh -q -i ~/.ssh/promptledger_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR ubuntu@${{ secrets.BACKEND_INSTANCE_IP }} 'sudo docker inspect --format "{{.State.Health.Status}}" promptledger-postgres' 2>/dev/null)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done

          ssh -q -i ~/.ssh/promptledger_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR ubuntu@${{ secrets.BACKEND_INSTANCE_IP }} '
            cd /opt/promptledger
            sudo docker compose -f docker-compose.prod.yml logs --no-color --tail=200 postgres
            sudo docker inspect promptledger-postgres --format "{{json .State}}"
          '
          exit 1

      - name: Start backend services
        run: |
          ssh -q -i ~/.ssh/promptledger_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR ubuntu@${{ secrets.BACKEND_INSTANCE_IP }} '
            set -e
            cd /opt/promptledger
            sudo docker compose -f docker-compose.prod.yml up -d --build --no-deps api celery-worker celery-beat
            sudo docker compose -f docker-compose.prod.yml ps
          '

  deploy-frontend:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          missing=0
          if [ -z "${{ secrets.AWS_PRIVATE_KEY }}" ]; then echo "Missing secret: AWS_PRIVATE_KEY"; missing=1; fi
          if [ -z "${{ secrets.FRONTEND_INSTANCE_IP }}" ]; then echo "Missing secret: FRONTEND_INSTANCE_IP"; missing=1; fi
          if [ -z "${{ secrets.API_URL }}" ]; then echo "Missing secret: API_URL"; missing=1; fi
          if [ $missing -ne 0 ]; then echo "One or more required secrets are missing. Add them in repository settings and retry."; exit 1; fi

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AWS_PRIVATE_KEY }}" > ~/.ssh/promptledger_deploy
          chmod 600 ~/.ssh/promptledger_deploy
          touch ~/.ssh/known_hosts

      - name: Sync frontend source
        run: |
          rsync -az --delete \
            -e "ssh -q -i ~/.ssh/promptledger_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            frontend/ \
            ubuntu@${{ secrets.FRONTEND_INSTANCE_IP }}:/opt/promptledger/frontend/

      - name: Prune frontend host copies
        run: |
          ssh -q -i ~/.ssh/promptledger_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR ubuntu@${{ secrets.FRONTEND_INSTANCE_IP }} '
            set -e
            rm -rf /opt/promptledger/backend /opt/promptledger/backend_copy_* /opt/promptledger/frontend_copy_*
            cd /opt/promptledger/frontend
            npm ci
            NEXT_PUBLIC_API_URL=${{ secrets.API_URL }} npm run build
            sudo systemctl daemon-reload
            if systemctl list-unit-files | grep -q "^promptledger-frontend.service"; then
              sudo systemctl restart promptledger-frontend
            else
              sudo systemctl enable --now promptledger-frontend
            fi
            sudo systemctl status promptledger-frontend --no-pager --full
          '

  smoke-tests:
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Run smoke tests
        run: |
          curl -f http://${{ secrets.FRONTEND_INSTANCE_IP }}:3000/login
          curl -f http://${{ secrets.BACKEND_INSTANCE_IP }}:8000/health
          curl -f http://${{ secrets.BACKEND_INSTANCE_IP }}:8000/metrics

      - name: Slack notification (success)
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_WEBHOOK not set; skipping success notification."
            exit 0
          fi

          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ Deployment successful to ${{ env.PROJECT_NAME }}\",\"blocks\":[{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"*Deployment Successful*\\nRepo: ${{ github.repository }}\\nBranch: ${{ github.ref }}\\nCommit: ${{ github.sha }}\"}}]}" \
            "$SLACK_WEBHOOK"

      - name: Slack notification (failure)
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_WEBHOOK not set; skipping failure notification."
            exit 0
          fi

          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Deployment failed for ${{ env.PROJECT_NAME }}\",\"blocks\":[{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"*Deployment Failed*\\nRepo: ${{ github.repository }}\\nBranch: ${{ github.ref }}\\nCommit: ${{ github.sha }}\"}}]}" \
            "$SLACK_WEBHOOK"
