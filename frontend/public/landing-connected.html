<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptLedger | Git for AI Behavior. CI/CD for LLM Prompts.</title>
    <script type="module" crossorigin src="/assets/index-Csl0Yyxr.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CoSDywPu.css">
    <link rel="stylesheet" crossorigin href="/assets/landing-font-override.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap');
      :root {
        --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      html, body, #root { font-family: var(--font-sans) !important; }
      code, kbd, pre, samp { font-family: var(--font-mono) !important; }
      /* Ensure hero covers full viewport when embedded as landing */
      .hero, .hero-section, .landing-hero { min-height: 100vh !important; display:flex; align-items:center; }
    </style>
  </head>
  <body>
    <style>
      #landing-auth-wrap {
        width: 100%;
        margin: 0;
        padding: 96px 24px 120px;
        background: #000;
        box-sizing: border-box;
      }
      #landing-auth {
        width: min(100%, 400px);
        margin: 0 auto;
        font-family: var(--font-sans);
      }
      #landing-auth .title {
        font-size: 30px;
        line-height: 1.2;
        font-weight: 700;
        margin: 0 0 18px;
        color: #fff;
        letter-spacing: -0.04em;
      }
      #landing-auth label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.82);
        margin: 14px 0 6px;
      }
      #landing-auth input {
        width: 100%;
        margin-top: 10px;
        padding: 14px 14px;
        border-radius: 12px;
        border: 1px solid #232323;
        background: #1a1a1a;
        color: #fff;
        outline: none;
        box-sizing: border-box;
      }
      #landing-auth input:focus {
        border-color: #00d4c8;
        box-shadow: 0 0 0 3px rgba(0, 212, 200, 0.16);
      }
      #landing-auth button.primary {
        width: 100%;
        padding: 13px 14px;
        border-radius: 12px;
        border: 0;
        margin-top: 16px;
        background: #00d4c8;
        color: #041010;
        font-weight: 700;
        cursor: pointer;
      }
      #landing-auth button.switch {
        width: 100%;
        margin-top: 12px;
        background: transparent;
        border: 0;
        color: #9e9e9e;
        text-decoration: underline;
        cursor: pointer;
        padding: 8px 0 0;
      }
      #landing-auth .msg {
        font-size: 13px;
        color: #f4dcdc;
        margin-top: 10px;
        min-height: 18px;
      }
      #landing-auth .hidden { display: none; }
      @media (max-width: 900px) {
        #landing-auth-wrap { padding: 72px 16px 96px; }
        #landing-auth { max-width: 100%; }
      }
    </style>

    <div id="root"></div>

    <div id="landing-auth-wrap">
      <div id="landing-auth">
        <div id="auth-title" class="title">Sign In</div>

        <label id="org-label" class="hidden" for="auth-org">Organization Name</label>
        <input id="auth-org" class="hidden" type="text" placeholder="Acme Corp" autocomplete="organization" />

        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email" />

        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" placeholder="••••••••" autocomplete="current-password" />

        <button id="auth-submit" class="primary">Sign In</button>
        <button class="switch" id="auth-toggle" type="button">Create account</button>
        <div class="msg" id="auth-msg" role="status" aria-live="polite"></div>
      </div>
    </div>

    <script>
      (function(){
        const base = '';
        let isRegister = false;
        const org = document.getElementById('auth-org');
        const orgLabel = document.getElementById('org-label');
        const email = document.getElementById('auth-email');
        const pass = document.getElementById('auth-password');
        const submit = document.getElementById('auth-submit');
        const toggle = document.getElementById('auth-toggle');
        const title = document.getElementById('auth-title');
        const msg = document.getElementById('auth-msg');

        function setLoading(v){
          submit.disabled = v;
          toggle.disabled = v;
          org.disabled = v;
          email.disabled = v;
          pass.disabled = v;
        }

        function renderMode(){
          title.textContent = isRegister ? 'Create account' : 'Sign In';
          submit.textContent = isRegister ? 'Register' : 'Sign In';
          toggle.textContent = isRegister ? 'Have an account? Sign in' : 'Create account';
          org.classList.toggle('hidden', !isRegister);
          orgLabel.classList.toggle('hidden', !isRegister);
          msg.textContent = '';
        }

        toggle.addEventListener('click', ()=>{
          isRegister = !isRegister;
          renderMode();
        });

        submit.addEventListener('click', async ()=>{
          const e = (email.value || '').trim();
          const p = pass.value || '';
          const o = (org.value || '').trim();
          if(!e || !p){ msg.textContent = 'Provide email and password'; return; }
          if(isRegister && !o){ msg.textContent = 'Provide organization name'; return; }

          setLoading(true);
          try{
            const body = isRegister ? { org_name: o, email: e, password: p } : { email: e, password: p };
            const paths = isRegister
              ? ['/api/v1/auth/register']
              : ['/api/v1/auth/login'];

            let res = null;
            let data = null;
            let lastError = null;

            for (const path of paths) {
              try {
                res = await fetch(path, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(body),
                });

                const text = await res.text();
                try {
                  data = text ? JSON.parse(text) : null;
                } catch {
                  data = { detail: text || 'Unexpected response from backend' };
                }

                if (res.ok && data && data.access_token) {
                  break;
                }

                lastError = (data && (data.detail || data.message)) || 'Authentication failed';
              } catch (error) {
                lastError = error && error.message ? error.message : String(error);
              }
            }

            if (!res || !res.ok || !data || !data.access_token) {
              msg.textContent = lastError || 'Authentication failed';
              return;
            }

            if(data && data.access_token){
              localStorage.setItem('access_token', data.access_token);
            }
            if(data && data.user){
              localStorage.setItem('user', JSON.stringify(data.user));
            }

            setTimeout(() => {
              window.location.assign('/overview');
            }, 50);
          }catch(err){
            msg.textContent = err && err.message ? err.message : String(err);
          } finally {
            setLoading(false);
          }
        });

        renderMode();

        document.addEventListener('click', (event) => {
          const target = event.target instanceof Element ? event.target.closest('button, a') : null;
          if (!target) return;

          const label = (target.textContent || '').trim();
          if (label !== 'Get Started Free') return;

          event.preventDefault();
          event.stopPropagation();
          document.getElementById('landing-auth')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, true);
      })();
    </script>

    <script>
      (function () {
        const root = document.getElementById('root');
        const authWrap = document.getElementById('landing-auth-wrap');
        if (!root || !authWrap) return;

        const moveAuthIntoLayout = () => {
          const footer = root.querySelector('footer');
          if (!footer) return false;
          if (authWrap.parentElement !== root || authWrap.nextElementSibling !== footer) {
            root.insertBefore(authWrap, footer);
          }
          return true;
        };

        if (moveAuthIntoLayout()) return;

        const observer = new MutationObserver(() => {
          if (moveAuthIntoLayout()) {
            observer.disconnect();
          }
        });

        observer.observe(root, { childList: true, subtree: true });
        window.addEventListener('load', () => {
          moveAuthIntoLayout();
          observer.disconnect();
        }, { once: true });
      })();
    </script>
  </body>
</html>
